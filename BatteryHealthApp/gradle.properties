# Gradle性能优化配置 - 深度优化
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=true

# Android Build优化
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# Kotlin代码优化
kotlin.code.style=official
kotlin.incremental=true

# 代理配置 - 与环境变量一致
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.svc|*.cluster.local|::1
systemProp.https.nonProxyHosts=localhost|127.0.0.1|*.svc|*.cluster.local|::1
systemProp.socksNonProxyHosts=localhost|127.0.0.1|*.svc|*.cluster.local|::1
systemProp.java.net.useSystemProxies=true
systemProp.http.agent=Gradle/8.14.4

# Java版本兼容性
android.suppressUnsupportedCompileSdk=34