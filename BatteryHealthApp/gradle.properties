# Gradle性能优化配置 - 深度优化
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=true

# Android Build优化
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# Kotlin代码优化
kotlin.code.style=official
kotlin.incremental=true

# 代理配置 - 已移除硬编码代理
# 如需使用代理，请在本地创建 local.properties 或设置环境变量
# 示例：systemProp.http.proxyHost=proxy.example.com
# 注意：不要将代理配置提交到版本控制

# Java版本兼容性
android.suppressUnsupportedCompileSdk=35