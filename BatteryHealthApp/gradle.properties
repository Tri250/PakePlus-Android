# Gradle性能优化配置 - 深度优化
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false
org.gradle.daemon=false

# Android Build优化
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false
android.builder.sdkDownload=false

# Kotlin代码优化
kotlin.code.style=official
kotlin.incremental=true

# Java版本兼容性
android.suppressUnsupportedCompileSdk=35,36
android.overrideVersionCheck=true
android.aapt2FromMavenOverride=/workspace/android-sdk/build-tools/36.0.0/aapt2