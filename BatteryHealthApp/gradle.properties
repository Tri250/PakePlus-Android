# Gradle性能优化配置 - 深度优化
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false
org.gradle.daemon=false

# Android Build优化
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# Kotlin代码优化
kotlin.code.style=official
kotlin.incremental=true

# 代理配置（当前环境需要通过本地代理 127.0.0.1:18080 访问外网）
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
systemProp.http.nonProxyHosts=localhost|127.0.0.1
systemProp.https.nonProxyHosts=localhost|127.0.0.1

# 网络超时配置，避免个别仓库节点无响应导致构建挂起
systemProp.http.connectionTimeout=30000
systemProp.http.socketTimeout=30000
systemProp.https.connectionTimeout=30000
systemProp.https.socketTimeout=30000
systemProp.http.keepAlive=false
org.gradle.internal.http.connection-timeout=30000
org.gradle.internal.http.socket-timeout=30000

# Java版本兼容性
android.suppressUnsupportedCompileSdk=35,36