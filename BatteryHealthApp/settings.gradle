pluginManagement {
    repositories {
        // 仅使用官方源，避免国内镜像节点偶发连接挂起
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        // 仅使用官方源与 JitPack，避免国内镜像节点偶发连接挂起
        google()
        mavenCentral()
        // JitPack (用于MPAndroidChart等第三方库)
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = "BatteryHealthApp"
include ':app'
