// Top-level build file - 仓库配置已迁移到 settings.gradle 统一管理
buildscript {
    repositories {
        // 仅使用官方源与 JitPack，避免国内镜像节点偶发连接挂起
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        // 升级到 AGP 8.8.2 以支持 Android 16 (SDK 36)
        classpath 'com.android.tools.build:gradle:8.8.2'
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
