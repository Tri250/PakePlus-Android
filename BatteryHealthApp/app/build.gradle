apply plugin: 'com.android.application'

// 从 keystore.properties 读取签名配置（安全做法）
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.batteryhealth.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.batteryhealth.app"
        minSdk 24
        targetSdk 35
        versionCode 39
        versionName "4.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // 性能优化配置
        resConfigs "zh"
        
        // 仅支持ARM架构，减少APK体积
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    // 签名配置 - 从 keystore.properties 读取正式签名
    signingConfigs {
        release {
            storeFile file(keystoreProperties['storeFile'] ?: 'release-keystore.jks')
            storePassword keystoreProperties['storePassword'] ?: ''
            keyAlias keystoreProperties['keyAlias'] ?: ''
            keyPassword keystoreProperties['keyPassword'] ?: ''
        }
        debug {
            // Debug使用默认调试签名
        }
    }

    // 在任务图就绪后检查：若执行 release 打包任务，必须存在正式签名配置
    gradle.taskGraph.whenReady { graph ->
        def releaseTasks = ['assembleRelease', 'bundleRelease']
        def hasReleaseTask = releaseTasks.any { taskName ->
            graph.allTasks.any { it.name == taskName }
        }
        if (hasReleaseTask && !keystorePropertiesFile.exists()) {
            throw new GradleException(
                "正式版打包必须提供 keystore.properties。" +
                "请复制 keystore.properties.example 为 keystore.properties 并填入正式签名信息。"
            )
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            signingConfig signingConfigs.release
        }

        debug {
            minifyEnabled false
            debuggable true
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    lintOptions {
        abortOnError true
        checkReleaseBuilds true
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    // 禁用JDK镜像转换
    tasks.withType(JavaCompile) {
        options.fork = false
    }
    
    buildFeatures {
        viewBinding true
    }
    
    // 打包选项
    packagingOptions {
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libjsc.so'
    }
}

dependencies {
    // AndroidX核心库 - 升级到支持Android 15 (SDK 35)的版本
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.3'
    implementation 'androidx.navigation:navigation-fragment:2.8.0'
    implementation 'androidx.navigation:navigation-ui:2.8.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.activity:activity:1.9.0'
    
    // 图表库 - 用于数据可视化
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    
    // 动画库
    implementation 'com.airbnb.android:lottie:6.4.1'
    
    // 图片加载
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    
    // 网络请求 (用于查询激活日期)
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    
    // Room数据库 (用于历史数据存储)
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // SQLCipher 数据库加密
    implementation 'net.zetetic:android-database-sqlcipher:4.5.4'
    implementation 'androidx.sqlite:sqlite:2.4.0'

    // EncryptedSharedPreferences 安全存储加密密钥
    implementation 'androidx.security:security-crypto:1.0.0'

    // Gson
    implementation 'com.google.code.gson:gson:2.10.1'

    // 权限管理
    implementation 'com.guolindev.permissionx:permissionx:1.7.1'

    // 测试依赖
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}