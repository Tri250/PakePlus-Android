apply plugin: 'com.android.application'

android {
    namespace 'com.batteryhealth.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.batteryhealth.app"
        minSdk 24
        targetSdk 34
        versionCode 215
        versionName "2.1.5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // 性能优化配置
        resConfigs "zh" // 只保留中文资源
    }

    // 签名配置
    signingConfigs {
        release {
            storeFile file('release-keystore.jks')
            storePassword 'batteryhealth123'
            keyAlias 'batteryhealth'
            keyPassword 'batteryhealth123'
        }
    }

    buildTypes {
        release {
            // Release配置 - 性能优化
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // 禁用调试
            debuggable false
            
            // 使用签名配置
            signingConfig signingConfigs.release

            // 跳过Lint检查以提升构建速度
            lintOptions {
                abortOnError false
                checkReleaseBuilds false
            }
        }

        debug {
            minifyEnabled false
            debuggable true
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'

            lintOptions {
                abortOnError false
            }
        }
    }

    // 全局Lint配置
    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // WebView扩展（WebViewAssetLoader用于临时文件访问）
    implementation 'androidx.webkit:webkit:1.8.0'

    // 测试依赖
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}