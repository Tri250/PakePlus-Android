apply plugin: 'com.android.application'

// 从 keystore.properties 读取签名配置（安全做法）
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.batteryhealth.app'
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "com.batteryhealth.app"
        minSdk 24
        targetSdk 36
        versionCode 55
        versionName "4.8.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // 性能优化配置
        resConfigs "zh"
    }

    // 签名配置 - 直接使用 keystore.properties 中的配置
    signingConfigs {
        release {
            storeFile rootProject.file(keystoreProperties['storeFile'] ?: 'release-keystore.jks')
            storePassword keystoreProperties['storePassword'] ?: 'android'
            keyAlias keystoreProperties['keyAlias'] ?: 'androiddebugkey'
            keyPassword keystoreProperties['keyPassword'] ?: 'android'
        }
        debug {
            // Debug 使用默认调试签名
        }
    }

    buildTypes {
        release {
            // 启用混淆和资源压缩，减小 APK 体积并提升安全性
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            signingConfig signingConfigs.release
        }

        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    // 打包选项
    packagingOptions {
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libjsc.so'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // 强制版本以匹配缓存
    configurations.all {
        resolutionStrategy.force 'androidx.databinding:viewbinding:8.8.2'
        resolutionStrategy.force 'androidx.fragment:fragment:1.6.2'
    }

    // AndroidX核心库（仅保留已缓存的依赖）
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.activity:activity:1.10.1'

    // 图表库 - 用于数据可视化
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Room数据库（仅runtime，无annotationProcessor）
    implementation 'androidx.room:room-runtime:2.6.1'

    // SQLCipher 数据库加密
    implementation 'net.zetetic:android-database-sqlcipher:4.5.4'
    implementation 'androidx.sqlite:sqlite:2.4.0'

    // Gson（已在缓存中）
    implementation 'com.google.code.gson:gson:2.11.0'
}