apply plugin: 'com.android.application'

android {
    namespace 'com.batteryhealth.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.batteryhealth.app"
        minSdk 24
        targetSdk 35
        versionCode 37
        versionName "4.0.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // 性能优化配置
        resConfigs "zh"
        
        // 仅保留 ARM 系列 ABI，项目无 native 库，x86/x86_64 无需打包
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    // 签名配置
    // Release 签名从环境变量或 local.properties 读取，避免密码入仓
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            def keystorePath = System.getenv('RELEASE_KEYSTORE_PATH') ?: project.findProperty('RELEASE_KEYSTORE_PATH')
            def storePwd = System.getenv('RELEASE_STORE_PASSWORD') ?: project.findProperty('RELEASE_STORE_PASSWORD')
            def keyAliasVal = System.getenv('RELEASE_KEY_ALIAS') ?: project.findProperty('RELEASE_KEY_ALIAS')
            def keyPwd = System.getenv('RELEASE_KEY_PASSWORD') ?: project.findProperty('RELEASE_KEY_PASSWORD')

            if (keystorePath != null && storePwd != null && keyAliasVal != null && keyPwd != null) {
                storeFile file(keystorePath)
                storePassword storePwd
                keyAlias keyAliasVal
                keyPassword keyPwd
            } else {
                // 本地开发兜底：若环境变量未配置则使用本地 debug 签名（禁止用于正式发布）
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            signingConfig signingConfigs.release
            lintOptions {
                abortOnError false
                checkReleaseBuilds false
            }
        }

        debug {
            minifyEnabled false
            debuggable true
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            signingConfig signingConfigs.debug
            lintOptions {
                abortOnError false
            }
        }
    }

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    // 禁用JDK镜像转换
    tasks.withType(JavaCompile) {
        options.fork = false
    }
    
    buildFeatures {
        viewBinding true
    }
    
    // 打包选项
    packagingOptions {
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libjsc.so'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'
    implementation 'androidx.navigation:navigation-fragment:2.7.7'
    implementation 'androidx.navigation:navigation-ui:2.7.7'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.core:core:1.12.0'
    
    // 图表库 - 用于数据可视化
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    
    // 动画库
    implementation 'com.airbnb.android:lottie:6.0.0'
    
    // 图片加载
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.15.1'
    
    // 网络请求 (用于查询激活日期)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.3'
    
    // Room数据库 (用于历史数据存储)
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    
    // Gson
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // 权限管理
    implementation 'com.guolindev.permissionx:permissionx:1.7.1'

    // 测试依赖
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}