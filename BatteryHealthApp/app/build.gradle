apply plugin: 'com.android.application'
apply plugin: 'dagger.hilt.android.plugin'

// 从 keystore.properties 读取签名配置（安全做法）
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = 'com.batteryhealth.app'
    compileSdk = 36
    buildToolsVersion = "36.0.0"

    defaultConfig {
        applicationId = "com.batteryhealth.app"
        minSdk = 24
        targetSdk = 36
        versionCode = 65
        versionName = "5.0.5"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        // 性能优化配置
        resourceConfigurations += ["zh"]

        // 仅支持ARM架构，减少APK体积；同时启用16KB页面大小支持（Android 16要求）
        // 注意：若后续接入NDK库，需在 externalNativeBuild { cmake {} } 中
        // 传递 -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON 并提供 CMakeLists.txt
        // ndk {
        //     abiFilters 'armeabi-v7a', 'arm64-v8a'
        // }
    }

    signingConfigs {
        release {
            storeFile rootProject.file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            // 启用混淆和资源压缩，减小 APK 体积并提升安全性
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
            debuggable = false
            // Release构建优化：移除无用资源、压缩代码
            crunchPngs = true
            zipAlignEnabled = true
        }

        debug {
            minifyEnabled = false
            debuggable = true
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    // AndroidX核心库 - 升级到适配 Android 16 (SDK 36) 的最新匹配稳定版本
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.navigation:navigation-fragment:2.8.9'
    implementation 'androidx.navigation:navigation-ui:2.8.9'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.activity:activity:1.10.0'

    // 图表库 - 用于数据可视化
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // 动画库
    implementation 'com.airbnb.android:lottie:6.7.1'

    // 图片加载
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // 网络请求 (用于查询激活日期与云端机型数据库)
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation('com.squareup.retrofit2:converter-gson:2.11.0') {
        exclude group: 'com.google.code.gson', module: 'gson'
    }
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Room数据库 (用于历史数据存储)
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // SQLCipher 数据库加密
    implementation 'net.zetetic:android-database-sqlcipher:4.5.4'
    implementation 'androidx.sqlite:sqlite:2.4.0'

    // EncryptedSharedPreferences 安全存储加密密钥
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Gson
    implementation 'com.google.code.gson:gson:2.13.2'

    // 权限管理
    implementation 'com.guolindev.permissionx:permissionx:1.8.1'

    // Hilt依赖注入
    implementation 'com.google.dagger:hilt-android:2.56'
    annotationProcessor 'com.google.dagger:hilt-compiler:2.56'

    // WorkManager
    implementation 'androidx.work:work-runtime:2.9.1'

    // LambdaMetafactory 编译期存根：修复 Android 36 平台 android.jar 缺失该符号导致 lambda 无法编译的问题
    compileOnly files('libs/lambda-stub.jar')

    // 测试依赖
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
