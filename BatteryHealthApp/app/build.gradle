apply plugin: 'com.android.application'

android {
    namespace 'com.batteryhealth.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.batteryhealth.app"
        minSdk 24
        targetSdk 36
        versionCode 60
        versionName "4.9.5"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
