name: Android Build & Release

on:
  push:
    branches: [main, master, "release/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version_name:
        description: "自定义版本号 (留空则使用 build.gradle 中的版本)"
        required: false
        default: ""

env:
  PROJECT_DIR: BatteryHealthApp

jobs:
  validate-config:
    name: 校验配置合法性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查 ppconfig.json 格式合法性
        run: |
          if [ -f "scripts/ppconfig.json" ]; then
            echo "检测到 ppconfig.json，开始校验格式..."
            if python3 -c "import json; json.load(open('scripts/ppconfig.json'))" 2>/dev/null; then
              echo "✅ ppconfig.json 格式合法"
            else
              echo "❌ ppconfig.json 格式非法，构建终止"
              exit 1
            fi
          else
            echo "未检测到 ppconfig.json，跳过格式校验"
          fi

  build:
    name: 构建 Android APK
    needs: validate-config
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      apk_size: ${{ steps.apk_info.outputs.apk_size }}
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 设置本地属性
        run: |
          cd ${{ env.PROJECT_DIR }}
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ ! -f keystore.properties ]; then
            echo "未检测到 keystore.properties，将使用 debug 签名"
            cp keystore.properties.example keystore.properties 2>/dev/null || true
          fi

      - name: 自定义版本号
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.version_name != '' }}
        run: |
          cd ${{ env.PROJECT_DIR }}
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ inputs.version_name }}\"/" app/build.gradle

      - name: 读取版本号
        id: version
        run: |
          cd ${{ env.PROJECT_DIR }}
          VERSION_NAME=$(grep -E "versionName\s+\"" app/build.gradle | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      - name: 授予 Gradle Wrapper 执行权限
        run: chmod +x ${{ env.PROJECT_DIR }}/gradlew

      - name: 构建 Release APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          ./gradlew assembleRelease --stacktrace

      - name: 重命名 APK 并输出信息
        id: apk_info
        run: |
          cd ${{ env.PROJECT_DIR }}
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" "app-release-${VERSION_NAME}.apk"
            cp "$APK_PATH" "app-release.apk"
            APK_SIZE_BYTES=$(stat -c%s "app-release-${VERSION_NAME}.apk" 2>/dev/null || echo 0)
            APK_SIZE_MB=$((APK_SIZE_BYTES / 1048576))
            APK_SIZE_HUMAN=$(ls -lh "app-release-${VERSION_NAME}.apk" | awk '{print $5}')
            echo "apk_size=${APK_SIZE_HUMAN}" >> $GITHUB_OUTPUT
            echo "✅ APK 构建成功: app-release-${VERSION_NAME}.apk (${APK_SIZE_HUMAN})"

            if [ "$APK_SIZE_MB" -gt 5 ]; then
              echo "⚠️ 警告: APK 体积超过 5MB 基线 (当前: ${APK_SIZE_MB} MB)"
            else
              echo "✅ APK 体积在 5MB 基线以内 (${APK_SIZE_MB} MB)"
            fi
          else
            echo "❌ APK 构建失败"
            exit 1
          fi

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.version.outputs.version_name }}
          path: |
            ${{ env.PROJECT_DIR }}/app-release-*.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: 上传 Mapping 文件
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ steps.version.outputs.version_name }}
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

  release:
    name: 发布到 Release
    needs: build
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-release-${{ needs.build.outputs.version_name }}

      - name: 检查 GitHub Token
        run: |
          if [ -z "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "⚠️ 未检测到 GitHub Token，跳过 Release 发布"
            echo "请在 Settings > Secrets > Actions 中配置 GITHUB_TOKEN"
            exit 0
          fi
          echo "✅ GitHub Token 已配置，继续发布"

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app-release-*.apk
            app-release.apk
          name: "Release ${{ needs.build.outputs.version_name }}"
          body: |
            ## BatteryHealthApp ${{ needs.build.outputs.version_name }}

            ### 产物信息
            - APK 体积: ${{ needs.build.outputs.apk_size }}
            - 目标 SDK: 36 (Android 16)
            - 最低 SDK: 24 (Android 7.0)

            ### 支持架构
            - armeabi-v7a
            - arm64-v8a

            ### 权限说明
            仅包含电池健康监测所必需的系统权限，无多余权限声明。
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}